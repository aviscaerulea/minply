# vim: set ft=toml fenc=utf-8 ff=unix sw=4 ts=4 et :
##################################################
# minply 個人設定ファイル
##################################################
#
# 動作を変えたい項目は、このファイルに書く。
# minply は minply.toml を読んだ後にこのファイルを読み、ここに書いた値で上書きする。
#
# minply.toml は全設定項目と既定値のリファレンスで、minply を更新するたびに新しい版へ置き換わるため、直接書き換えた変更は更新で消える。
# Scoop で更新しても、このファイルの設定はそのまま残る。
# ZIP を展開し直して更新するときは、このファイルを上書きしない。
#
# 書き方：minply.toml から変えたい項目を、セクション見出しごとこのファイルへ写す。
# 次に、写した行の行頭の # を外して値を変える。
#
# [loudness]
# target = -20.0
#
# 配列の項目（[tray] mute_durations）は、minply.toml の値に足さず全体を置き換える。
# [[mute]] は、minply.toml に書いた条件に足して読み込む。
