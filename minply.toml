# vim: set ft=toml fenc=utf-8 ff=unix sw=4 ts=4 et :
##################################################
# minply 設定ファイル
##################################################
#
# 全設定項目と既定値のリファレンス。minply を更新するたびに新しい版へ置き換わる。
# 設定を変えるときはこのファイルを書き換えず、同じフォルダの minply.local.toml に書く。
# minply は minply.local.toml の値を、このファイルの値より優先する。

# ガードトーン設定
[guard]
# ガードトーンの有効／無効
# Bluetooth レシーバの省電力モード抑止のため、本編の前後に不可聴の高周波トーンを再生する
# デフォルト：true
# enabled = true

# リードイン秒数
# Bluetooth ウェイクアップ（約 700ms）＋ WASAPI セッション起動ノイズのマージン
# デフォルト：1.2
# lead_in_duration = 1.2

# リードアウト秒数
# SBC コーデックパイプラインの末尾バッファが抜けるまで Bluetooth をアクティブに保つ
# デフォルト：1.2
# lead_out_duration = 1.2

# ガードトーン周波数（Hz）
# 19000.0 は成人には聞こえない高周波であり、レシーバだけを起こし続ける
# デフォルト：19000.0（許容範囲：20.0〜20000.0）
# frequency = 19000.0

# ガードトーン振幅
# 0.001 は約 -60dB に相当し、可聴域の音を妨げない
# デフォルト：0.001（許容範囲：0.0〜1.0）
# amplitude = 0.001

# ラウドネスノーマライズ設定
[loudness]
# ラウドネスノーマライズの有効／無効
# EBU R128（ITU-R BS.1770-4）に基づき、ソースごとの音量差を統一する
# デフォルト：true
# enabled = true

# 目標ラウドネス（LUFS）
# 通知音に最適化した -16.0 LUFS を使用する
# デフォルト：-16.0
# target = -16.0

# サンプルピーク上限（-1dBFS = 0.891）
# ラウドネスゲイン後のクリッピングを防止する
# デフォルト：0.891
# peak_ceiling = 0.891

# セッション常駐設定
[linger]
# 常駐秒数
# --session 指定時、最後の再生完了からこの秒数だけプロセスが常駐する
# 常駐中はガードトーンを流し続けてレシーバのスリープを抑止する
# 常駐中に同一セッションの再生要求が来ると、リードインなしで直ちに再生する
# --session を指定しない起動では無視する
# デフォルト：30.0（許容範囲：1.0〜600.0）
# duration = 30.0

# ログ設定
[log]
# ログを残す日数
# minply.exe --tray の起動時に、今日を含めてこの日数より古い日付のログを削除する
# トレイを起動しない使い方では削除しない
# 0 を指定すると削除せずにすべて残す
# デフォルト：7（許容範囲：0〜3650）
# retention_days = 7

# ミュート条件設定
# 条件のどれかに当たると、再生せずに終了コード 0 で直ちに終了する
# 再生しなかった理由はログ（minply.exe と同じフォルダの logs）に残る
# マイク／カメラ使用中のミュートは、トレイのメニューで切り替える
[mute]
# 起動していると再生しないプロセス
# exe のファイル名で指定し、大文字小文字は区別しない
# 配列は 1 行で書く（複数行に分けた配列は読み込めない）
# デフォルト：[]（なし）
# processes = ["avply.exe"]

# ウィンドウタイトルの条件（[[mute.window]] を繰り返して複数指定できる）
# process のプロセスが開いている表示中のウィンドウのうち、タイトルが title に当たるものがあると再生しない
# title は正規表現で、大文字小文字を区別せず、タイトルの一部に当たれば一致とする
# 正規表現は ' ' で囲むと \ をそのまま書ける
# ブラウザは各ウィンドウで表示中のタブのタイトルだけが対象になる
# process と title の両方が必要（片方だけの指定は無視する）
# minply.local.toml の [[mute.window]] は、minply.toml の分に足して読み込む
# [[mute.window]]
# process = "chrome.exe"
# title = 'Google Meet'

# トレイ常駐設定
# minply.exe --tray の起動時にだけ読む（変更はトレイの再起動後に有効）
[tray]
# ミュート条件を確かめる間隔（秒）
# ミュート条件によるアイコンの斜線とツールチップを、この間隔で更新する
# 再生するかどうかは再生のたびに判定するため、この値に影響されない
# 短くするとアイコンの反映が早まる代わりに、確認の回数が増える
# デフォルト：5.0（許容範囲：1.0〜60.0）
# condition_interval = 5.0

# トレイメニューに出す時間指定ミュートの長さ
# 整数に単位 s（秒）、m（分）、h（時間）を付けて書く（1 秒〜7 日）
# メニューには「30 分間ミュート」のように表示する
# 配列は 1 行で書く
# デフォルト：["30m", "60m", "90m", "12h"]
# mute_durations = ["30m", "60m", "90m", "12h"]
